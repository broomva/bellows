edition          = "2024"
max_width        = 100
hard_tabs        = false
tab_spaces       = 4
newline_style    = "Unix"
use_field_init_shorthand = true
use_try_shorthand        = true
reorder_imports          = true
# imports_granularity / group_imports are nightly-only (rustfmt 1.7+ stable
# does not support them yet). Re-enable when stable.
