name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to keep the queue tight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Belt-and-suspenders: any warning anywhere in the build fails CI, on top of
  # the explicit `clippy -- -D warnings` gate below.
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  # Fast-feedback lane — fmt + clippy + cargo check on the workspace.
  # rustfmt and clippy lints don't depend on link, so this lands first.
  check:
    name: check / clippy / fmt
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel (1.85.0) and the components we need
      # (rustfmt, clippy). Installing `stable` here would be redundant and risk
      # drift; the toolchain file is the single source of truth.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bellows-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo check --workspace
        run: cargo check --workspace --locked

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Run the workspace test suite. Ubuntu is mandatory; macOS is opportunistic
  # via fail-fast: false so a flaky macOS runner cannot block the merge.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bellows-test-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib --locked

  # Supply-chain gate. License + advisory checks must pass.
  # cargo-deny v2 is run in its native check mode (advisories|bans|licenses|sources).
  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # Don't tank the merge for a transient advisory-DB flake — but still fail
    # the job so the badge goes red. continue-on-error stays false: we want
    # the signal. Future tweak if noise emerges.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install

      - name: cargo-deny check
        # Pinned upstream action — runs `cargo deny check` against deny.toml.
        # `arguments: --all-features` would expand the dep graph; we keep the
        # default to mirror what users actually compile.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Drop `manifest-path` to default to repo root Cargo.toml.
          # Run all four categories: advisories, bans, licenses, sources.
          arguments: --workspace
