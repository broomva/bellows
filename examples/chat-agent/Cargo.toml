[package]
name        = "bellows-example-chat-agent"
description = "Conversational Bellows agent — takes full message history, replies in chat shape, optional tool use."
version     = "0.0.0"
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
publish     = false

[[bin]]
name = "chat-agent"
path = "src/main.rs"

[dependencies]
bellows-core           = { path = "../../crates/bellows-core" }
bellows-model          = { path = "../../crates/bellows-model" }
bellows-runtime        = { path = "../../crates/bellows-runtime" }
bellows-sandbox        = { path = "../../crates/bellows-sandbox" }
bellows-sandbox-local  = { path = "../../crates/bellows-sandbox-local" }
bellows-server         = { path = "../../crates/bellows-server" }
bellows-session        = { path = "../../crates/bellows-session" }
bellows-tool           = { path = "../../crates/bellows-tool" }

async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true }
