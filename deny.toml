# cargo-deny config — supply-chain gate for bellows
# Run: `cargo deny check`

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked  = "deny"
ignore  = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    # webpki-roots ≥ 1.0 — Mozilla CA bundle, OSI-approved permissive license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Workspace path dependencies (e.g. examples → ../../crates/bellows-core) do not
# carry a version requirement and would otherwise trip the wildcard rule. Allow
# wildcards exclusively for first-party path/git deps; remote-registry wildcards
# remain a hard error.
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # bans go here as the dep tree grows
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
